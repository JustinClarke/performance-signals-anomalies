<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>G505 Class Survey</title>
<meta name="description" content="An anonymous 4-minute survey for MPBA G505 classmates.">
<style>
:root {
  --bg:#f4f3ef; --card:#ffffff; --ink:#1b1d2a; --muted:#5d6173; --line:#d9d8d0;
  --accent:#3b4fa0; --accent-ink:#ffffff; --accent-soft:#e6e9f7; --warm:#c04f1a; --on-warm:#ffffff;
  --chip:#ffffff; --chip-sel:#3b4fa0; --track:#e1e0d8; --ok:#1f7a5a; --err:#a8325e;
  --shadow:0 6px 24px rgba(27,29,42,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#14151d; --card:#1e2030; --ink:#eceef7; --muted:#a2a6bd; --line:#34374d;
    --accent:#9fb0ff; --accent-ink:#14151d; --accent-soft:#272b45; --warm:#ff9a6b; --on-warm:#14151d;
    --chip:#1e2030; --chip-sel:#9fb0ff; --track:#2d3047; --ok:#6fd1a8; --err:#ff8fb3;
    --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:#14151d; --card:#1e2030; --ink:#eceef7; --muted:#a2a6bd; --line:#34374d;
  --accent:#9fb0ff; --accent-ink:#14151d; --accent-soft:#272b45; --warm:#ff9a6b; --on-warm:#14151d;
  --chip:#1e2030; --chip-sel:#9fb0ff; --track:#2d3047; --ok:#6fd1a8; --err:#ff8fb3;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; min-height:100vh; }
.wrap { max-width:640px; margin:0 auto; padding:16px 16px 48px; }
.top { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0 8px; }
.chapters { display:flex; gap:4px; margin:0 0 8px; padding:0; list-style:none; }
.chapters li { flex:1; text-align:center; font-size:.72rem; line-height:1.2; color:var(--muted); font-weight:600; transition:color .3s; }
.chapters li.on { color:var(--accent); }
.chapters li.done { color:var(--ink); }
.bar { height:10px; border-radius:99px; background:var(--track); overflow:hidden; }
.bar > i { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--warm)); transition:width .55s cubic-bezier(.3,.9,.3,1); }
.screen { animation:rise .35s ease both; padding-top:20px; }
@keyframes rise { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
@media (prefers-reduced-motion: reduce) { .screen { animation:none; } .bar > i { transition:none; } }
h1, h2 { outline:none; }
h1 { font-size:clamp(2rem,8vw,2.8rem); line-height:1.08; margin:0 0 12px; letter-spacing:-.02em; }
h2.q { font-size:clamp(1.5rem,6vw,2.1rem); line-height:1.18; margin:0 0 8px; letter-spacing:-.01em; }
.kicker { color:var(--accent); font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; margin:0 0 8px; }
.lede { font-size:1.1rem; color:var(--ink); margin:0 0 16px; }
.hint { color:var(--muted); margin:0 0 18px; font-size:.95rem; }
.box { background:var(--accent-soft); border-radius:16px; padding:14px 16px; margin:0 0 20px; }
.box ul { margin:0; padding:0; list-style:none; }
.box li { padding:3px 0 3px 26px; position:relative; }
.box li::before { content:"✓"; position:absolute; left:2px; color:var(--ok); font-weight:800; }
fieldset { border:0; padding:0; margin:0; min-width:0; }
.chips { display:grid; gap:10px; margin:0 0 20px; }
.chips.grid { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
.chips.col { grid-template-columns:1fr; }
.chips.scale { grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:6px; }
.chip { position:relative; display:block; }
.chip input { position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
.chip span { display:flex; align-items:center; justify-content:center; text-align:center; min-height:58px; padding:10px 14px; border:2px solid var(--line); border-radius:16px; background:var(--chip); font-size:1.05rem; font-weight:600; transition:transform .12s, background .2s, border-color .2s, color .2s; }
.chips.col .chip span { justify-content:flex-start; text-align:left; }
.chips.scale .chip span { padding:8px 0; font-size:1.25rem; }
.chip:hover span { border-color:var(--accent); }
.chip input:checked + span { background:var(--chip-sel); border-color:var(--chip-sel); color:var(--accent-ink); transform:scale(1.02); }
.chip input:focus-visible + span { outline:3px solid var(--warm); outline-offset:2px; }
.ends { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.85rem; margin:0 0 20px; }
.num { width:100%; font:inherit; font-size:1.6rem; font-weight:700; padding:14px 16px; border-radius:16px; border:2px solid var(--line); background:var(--chip); color:var(--ink); margin:0 0 6px; }
.num:focus { outline:3px solid var(--warm); outline-offset:2px; border-color:var(--accent); }
.err { color:var(--err); min-height:1.5em; margin:0 0 14px; font-size:.95rem; font-weight:600; }
.nav { display:flex; gap:10px; align-items:center; }
.btn { font:inherit; font-weight:700; font-size:1.05rem; border-radius:16px; border:2px solid var(--accent); padding:14px 22px; min-height:54px; cursor:pointer; background:var(--accent); color:var(--accent-ink); transition:transform .1s, opacity .2s; }
.btn:active { transform:scale(.98); }
.btn.ghost { background:transparent; color:var(--accent); }
.btn.grow { flex:1; }
.btn[aria-disabled="true"] { opacity:.45; cursor:not-allowed; }
.btn:focus-visible, .link:focus-visible { outline:3px solid var(--warm); outline-offset:2px; }
.link { background:none; border:0; padding:6px 0; font:inherit; color:var(--muted); text-decoration:underline; cursor:pointer; }
.foot { margin-top:28px; color:var(--muted); font-size:.82rem; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.conv { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 18px; font-size:.95rem; }
.conv label { display:block; font-weight:600; margin-bottom:6px; }
.conv .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.conv input { width:6.5em; font:inherit; font-size:1rem; padding:8px 10px; border-radius:10px; border:2px solid var(--line); background:var(--chip); color:var(--ink); }
.conv button { font:inherit; padding:8px 12px; border-radius:10px; border:2px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; cursor:pointer; }
.slider { width:100%; margin:8px 0 4px; accent-color:var(--accent); height:36px; }
.big { font-size:3rem; font-weight:800; color:var(--accent); line-height:1; margin:0 0 12px; }
.card { border-radius:24px; padding:28px 22px; color:#fff; box-shadow:var(--shadow); margin:0 0 16px; }
.card .em { font-size:3.4rem; line-height:1; }
.card h2 { font-size:1.9rem; line-height:1.1; margin:10px 0 6px; }
.card p { margin:0 0 10px; font-size:1.05rem; }
.card ul { margin:0; padding-left:1.1em; }
.card small { display:block; margin-top:14px; opacity:.85; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:0 0 16px; }
.panel h3 { margin:0 0 8px; font-size:1.05rem; }
.cmp { margin:0 0 20px; }
.cmp h3 { font-size:1.05rem; margin:0 0 8px; }
.row2 { display:grid; grid-template-columns:minmax(80px,32%) 1fr 3.2em; gap:8px; align-items:center; margin:6px 0; font-size:.9rem; }
.row2 .t { height:16px; background:var(--track); border-radius:99px; overflow:hidden; }
.row2 .t i { display:block; height:100%; background:var(--accent); border-radius:99px; opacity:.55; }
.row2.me .t i { opacity:1; background:var(--warm); }
.row2 .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
.row2 .hid { color:var(--muted); font-style:italic; font-size:.8rem; grid-column:2 / 4; }
.tag { font-size:.7rem; background:var(--warm); color:var(--on-warm); border-radius:99px; padding:1px 7px; margin-left:4px; font-weight:700; }
.banner { background:var(--card); border:1px dashed var(--warm); border-radius:12px; padding:8px 12px; font-size:.85rem; margin:0 0 12px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

.journey { position:relative; padding:0 0 0; }
.rider { position:absolute; top:-9px; left:0; font-size:22px; line-height:1; transform:translateX(-50%); transition:left .55s cubic-bezier(.3,.9,.3,1); pointer-events:none; }
.status { margin:6px 0 0; font-size:.8rem; color:var(--muted); min-height:1.2em; }
.screen.fwd { animation:inR .38s cubic-bezier(.2,.8,.2,1) both; }
.screen.bck { animation:inL .38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes inR { from { opacity:0; transform:translateX(28px);} to { opacity:1; transform:none;} }
@keyframes inL { from { opacity:0; transform:translateX(-28px);} to { opacity:1; transform:none;} }
.chip.pulse span { animation:pop .32s ease; }
@keyframes pop { 0% { transform:scale(1);} 40% { transform:scale(1.07);} 100% { transform:scale(1.02);} }
.btn:hover { filter:brightness(1.06); }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:0; list-style:none; }
.pills li { background:var(--accent-soft); border-radius:99px; padding:4px 12px; font-size:.85rem; font-weight:600; }
.cemoji { font-size:3rem; line-height:1; margin:0 0 8px; }
.kbdhint { display:none; color:var(--muted); font-size:.8rem; margin:18px 0 0; }
@media (hover:hover) and (pointer:fine) { .kbdhint { display:block; } }
.reveal { animation:flip .9s cubic-bezier(.2,.9,.25,1.15) both; transform-origin:50% 60%; }
@keyframes flip { from { opacity:0; transform:perspective(900px) rotateY(-80deg) scale(.7);} to { opacity:1; transform:none;} }
.fadein { animation:rise .6s ease both; }
.vs { margin:10px 0 6px; }
.vs .lab { display:flex; justify-content:space-between; font-weight:700; margin:10px 0 4px; }
.vs .trk { height:22px; background:var(--track); border-radius:99px; overflow:hidden; }
.vs .trk i { display:block; height:100%; width:0; border-radius:99px; transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
.vs .g i { background:var(--accent); } .vs .r i { background:var(--warm); }
.confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20; }
.confetti b { position:absolute; top:-14px; width:10px; height:16px; border-radius:2px; animation:fall var(--d) linear var(--dl) forwards; }
@keyframes fall { to { transform:translate3d(var(--x),105vh,0) rotate(var(--r)); opacity:.9; } }
@media (prefers-reduced-motion: reduce) {
  .screen, .screen.fwd, .screen.bck, .reveal, .fadein, .chip.pulse span { animation:none; }
  .rider, .vs .trk i, .chip span { transition:none; }
  .confetti { display:none; }
}
</style>
</head>
<body>
<noscript><div class="wrap"><h1>This survey needs JavaScript.</h1><p>Turn it on and reload the page.</p></div></noscript>
<div class="wrap">
  <header class="top" id="top" hidden>
    <ol class="chapters" id="chapters" aria-label="Chapters"></ol>
    <div class="journey">
      <div class="bar" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barwrap"><i id="bar"></i></div>
      <span class="rider" id="rider" aria-hidden="true">🎒</span>
    </div>
    <p class="status" id="status"></p>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
