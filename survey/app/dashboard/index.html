<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>BITS vs UCI dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f6; --card: #ffffff; --card-2: #f6f8fb; --text: #131a26; --muted: #5a6577; --line: #dde2ea;
  --accent: #2456d6; --accent-text: #ffffff; --err: #b3261e; --banner: #c62828; --banner-text: #ffffff;
  --c-bits: #0b9e8f; --c-uci: #7048e8; --sel: rgba(36, 86, 214, .10); --shadow: 0 1px 2px rgba(19, 26, 38, .06), 0 6px 18px rgba(19, 26, 38, .06);
  --shadow-up: 0 2px 4px rgba(19, 26, 38, .08), 0 14px 30px rgba(19, 26, 38, .12);
  --glow-1: rgba(36, 86, 214, .10); --glow-2: rgba(11, 158, 143, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e14; --card: #151a24; --card-2: #1b2130; --text: #e8ecf3; --muted: #97a2b5; --line: #262e3d;
    --accent: #7ea2ff; --accent-text: #0b0e14; --err: #ff8a80; --banner: #b71c1c;
    --c-bits: #2dd4bf; --c-uci: #a78bfa; --sel: rgba(126, 162, 255, .14); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    --shadow-up: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 34px rgba(0, 0, 0, .5);
    --glow-1: rgba(126, 162, 255, .10); --glow-2: rgba(45, 212, 191, .08);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e14; --card: #151a24; --card-2: #1b2130; --text: #e8ecf3; --muted: #97a2b5; --line: #262e3d;
  --accent: #7ea2ff; --accent-text: #0b0e14; --err: #ff8a80; --banner: #b71c1c;
  --c-bits: #2dd4bf; --c-uci: #a78bfa; --sel: rgba(126, 162, 255, .14); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  --shadow-up: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 34px rgba(0, 0, 0, .5);
  --glow-1: rgba(126, 162, 255, .10); --glow-2: rgba(45, 212, 191, .08);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; }
body {
  background: radial-gradient(900px 500px at 8% -10%, var(--glow-1), transparent 60%), radial-gradient(800px 500px at 100% 0%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
.error { color: var(--err); font-weight: 600; }
.banner { background: var(--banner); color: var(--banner-text); font-weight: 700; padding: 10px 16px; text-align: center; }

.shell { max-width: 1680px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-right: auto; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 10px; flex: none; background: linear-gradient(135deg, var(--c-bits), var(--c-uci)); box-shadow: var(--shadow); }
h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
.pill:empty { display: none; }
.pill.n { color: var(--text); }
button { font: inherit; font-weight: 600; border-radius: 10px; cursor: pointer; }
.btn { padding: 7px 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 10px 18px; }
.btn:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* sign in */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); max-width: 460px; margin: 6vh auto 0; width: 100%; }
.card h2 { margin: 0 0 8px; font-size: 1.15rem; }

/* slicers */
.slicers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.slicer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slicer-l { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 13px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: .85rem; border-radius: 999px; transition: background .2s, color .2s, border-color .2s, transform .15s; }
.chip:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.legend { display: flex; gap: 14px; margin-left: auto; font-size: .82rem; font-weight: 600; }
.lg { display: inline-flex; align-items: center; gap: 6px; transition: opacity .3s; }
.lg i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.s-BITS { color: var(--c-bits); }
.s-UCI { color: var(--c-uci); }
.lg.off { opacity: .35; }

/* KPI cards */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px 10px 17px; box-shadow: var(--shadow); min-width: 0;
  transition: transform .2s ease, box-shadow .2s ease, opacity .3s; animation: rise .5s ease both; animation-delay: var(--d, 0ms); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: currentColor; }
.kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
.kpi.off { opacity: .35; }
.kpi-l { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kpi-v { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; overflow-wrap: anywhere; }
.kpi-v.small { font-size: .95rem; line-height: 1.6; color: var(--muted); }
.kpi-s { font-size: .72rem; color: var(--muted); min-height: 1.1em; }

/* visuals */
.board { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.vis { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; min-height: 0;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; animation: rise .55s ease both; }
.vis:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--accent); }
.v1 { animation-delay: .05s; } .v2 { animation-delay: .1s; } .v3 { animation-delay: .15s; } .v4 { animation-delay: .2s; } .v5 { animation-delay: .25s; } .v6 { animation-delay: .3s; }
.vis-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.vis-h h3 { margin: 0; font-size: .95rem; font-weight: 600; }
.vis-s { font-size: .72rem; color: var(--muted); text-align: right; }
.vis-b { flex: 1; min-height: 0; display: flex; align-items: center; }
.chart { width: 100%; height: auto; display: block; max-height: 100%; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .tick.strong { fill: currentColor; font-weight: 700; font-size: 12px; }
.chart .sel { fill: var(--sel); }
.chart .wh { stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.chart .wh.cap { stroke-width: 2; }
.chart .wh.wide { stroke-width: 5; }
.chart .dot { fill: currentColor; stroke: var(--card); stroke-width: 2; }
.chart .bar { fill: currentColor; }
.chart .mk { outline: none; transition: opacity .2s; }
.chart .mk.click { cursor: pointer; }
.chart:has(.mk:hover) .mk:not(:hover), .chart:has(.mk:focus-visible) .mk:not(:focus-visible) { opacity: .3; }
.chart .pt:hover .dot, .chart .pt:focus-visible .dot { stroke: var(--text); }
.chart .pt { animation: fadein .5s ease both; animation-delay: var(--d, 0ms); }
.chart .pt .dot { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d, 0ms); }
.chart .pt .wh { transform-box: fill-box; transform-origin: center; animation: grow .5s ease both; animation-delay: var(--d, 0ms); }
.chart .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .6s cubic-bezier(.2, .8, .3, 1) both; animation-delay: var(--d, 0ms); }

/* table */
.tablewrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; }
tr:first-child th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
td { font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; transition: background .15s; }
tr.click:hover { background: var(--card-2); }
tr.click.on { background: var(--sel); }
tr.total th, tr.total td { font-weight: 700; border-bottom: 0; }

.foot { font-size: .72rem; color: var(--muted); line-height: 1.5; margin: 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 280px; padding: 8px 11px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: .8rem; font-weight: 500; box-shadow: var(--shadow-up); opacity: 0; transition: opacity .12s; left: 0; top: 0; }
.tip.on { opacity: 1; }

#app { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

@media (min-width: 700px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1200px) {
  .kpis { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .kpi-v { font-size: 1.4rem; }
}
/* One-screen layout on desktop: header, slicers, KPIs and the 3x2 grid share the viewport height. */
@media (min-width: 1100px) and (min-height: 720px) {
  html, body { height: 100%; overflow: hidden; }
  .shell { height: 100vh; min-height: 0; padding: 14px 18px; gap: 10px; }
  #app { gap: 10px; min-height: 0; }
  .board { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); flex: 1; min-height: 0; }
  .chart { height: 100%; }
  .foot { font-size: .66rem; line-height: 1.35; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="banner" class="banner hidden" role="alert">FAKE PREVIEW DATA. Not real survey results.</div>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>BITS vs UCI</h1>
      <span class="pill" id="source-label"></span>
      <span class="pill n" id="n-chip"></span>
    </div>
    <button id="theme-btn" class="btn" type="button">Dark mode</button>
    <button id="signout" class="btn hidden" type="button">Sign out</button>
  </header>

  <section id="signin" class="card">
    <h2>Sign in</h2>
    <p>Sign in with the Google account that owns this dashboard.</p>
    <button id="signin-btn" class="btn primary" type="button">Sign in with Google</button>
    <p id="signin-error" class="error" role="alert"></p>
  </section>

  <section id="app" class="hidden">
    <p id="load-error" class="error" role="alert"></p>
    <div id="slicers" class="slicers"></div>
    <div id="kpis" class="kpis"></div>
    <div id="grid" class="board"></div>
    <p id="foot" class="foot"></p>
  </section>
</div>
<div id="tip" class="tip" role="tooltip"></div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
